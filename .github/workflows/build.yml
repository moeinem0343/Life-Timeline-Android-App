name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # اکسترکت و جابه‌جایی فایل‌ها به مسیر اصلی
    - name: Unzip Project
      run: |
        unzip -o *.zip -d extracted_temp
        cp -r extracted_temp/*/* . 2>/dev/null || cp -r extracted_temp/* . 2>/dev/null || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # اعطای دسترسی اجرائی به gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ساخت فایل APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # آپلود و ذخیره فایل APK خروجی
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LifeTimeline-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
